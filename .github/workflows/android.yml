YAML

name: Build Office Master APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OfficeMaster_Android_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q OfficeMaster_Android_Project.zip -d /tmp/officemaster-src
          cp -R /tmp/officemaster-src/OfficeMaster/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfficeMaster-APK
          path: app/build/outputs/apk/debug/app-debug.apk
